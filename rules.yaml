apiVersion: 1

groups:
  - orgId: 1
    name: db-alerts
    folder: LLM-Test-Alerts
    interval: 1m
    rules:
      - uid: llm-test-db-high-storage
        title: "[llm]-[test]-[db]-[high]-[storage]"
        condition: C
        for: 5m
        labels:
          severity: high
          environment: test
          component: database
        annotations:
          summary: "RDS Free Storage Space is low"
          description: "Free storage space is below 10GB."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: cloudwatch-ds
            model:
              namespace: AWS/RDS
              metricName: FreeStorageSpace
              statistic: Minimum
              dimensions:
                DBInstanceIdentifier: "*"
              period: "300"
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 10737418240
                  operator:
                    type: and
                  query:
                    params:
                      - B

      - uid: llm-test-db-high-cpu
        title: "[llm]-[test]-[db]-[high]-[cpu]"
        condition: C
        for: 5m
        labels:
          severity: high
          environment: test
          component: database
        annotations:
          summary: "RDS CPU Utilization is high"
          description: "Database CPU utilization is above 85%."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: cloudwatch-ds
            model:
              namespace: AWS/RDS
              metricName: CPUUtilization
              statistic: Average
              dimensions:
                DBInstanceIdentifier: "*"
              period: "300"
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: mean
          - refId: C
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 70
                  operator:
                    type: and
                  query:
                    params:
                      - B

      - uid: llm-test-db-high-memory
        title: "[llm]-[test]-[db]-[high]-[memory]"
        condition: C
        for: 5m
        labels:
          severity: high
          environment: test
          component: database
        annotations:
          summary: "RDS Freeable Memory is low"
          description: "Freeable memory is less than 100MB."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: cloudwatch-ds
            model:
              namespace: AWS/RDS
              metricName: FreeableMemory
              statistic: Average
              dimensions:
                DBInstanceIdentifier: "*"
              period: "300"
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: mean
          - refId: C
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 100000000
                  operator:
                    type: and
                  query:
                    params:
                      - B

  - orgId: 1
    name: ec2-alerts
    folder: LLM-Test-Alerts
    interval: 1m
    rules:
      - uid: llm-test-ec2-low-cpu
        title: "[llm]-[test]-[ec2]-[low]-[cpu]"
        condition: B
        for: 15m
        labels:
          severity: low
          environment: test
          component: ec2
        annotations:
          summary: "EC2 CPU usage is very low"
          description: "Instance {{ $labels.instance }} CPU is below 0.4%."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              editorMode: code
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              range: false
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 0.4
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      - uid: llm-test-ec2-high-cpu
        title: "[llm]-[test]-[ec2]-[high]-[cpu]"
        condition: B
        for: 5m
        labels:
          severity: high
          environment: test
          component: ec2
        annotations:
          summary: "EC2 High CPU Load"
          description: "Instance {{ $labels.instance }} CPU is above 70%."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              editorMode: code
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              range: false
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 70
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      - uid: llm-test-ec2-low-memory
        title: "[llm]-[test]-[ec2]-[low]-[memory]"
        condition: B
        for: 15m
        labels:
          severity: low
          environment: test
          component: ec2
        annotations:
          summary: "EC2 Memory usage is low"
          description: "Instance {{ $labels.instance }} RAM usage is below 10%."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              editorMode: code
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
              instant: true
              range: false
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 10
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      - uid: llm-test-ec2-high-memory
        title: "[llm]-[test]-[ec2]-[high]-[memory]"
        condition: B
        for: 5m
        labels:
          severity: high
          environment: test
          component: ec2
        annotations:
          summary: "EC2 High Memory Usage"
          description: "Instance {{ $labels.instance }} RAM usage is above 70%."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              editorMode: code
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
              instant: true
              range: false
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 50
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      - uid: llm-test-ec2-low-disk-space
        title: "[llm]-[test]-[ec2]-[low]-[disk-space]"
        condition: B
        for: 10m
        labels:
          severity: low
          environment: test
          component: ec2
        annotations:
          summary: "EC2 Disk Space Warning"
          description: "Instance {{ $labels.instance }} disk usage on {{ $labels.mountpoint }} is lower than 350%."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              editorMode: code
              expr: 100 - ((node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} * 100) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
              instant: true
              range: false
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 10
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      - uid: llm-test-ec2-high-disk-space
        title: "[llm]-[test]-[ec2]-[high]-[disk-space]"
        condition: B
        for: 5m
        labels:
          severity: high
          environment: test
          component: ec2
        annotations:
          summary: "EC2 Disk Space High"
          description: "Instance {{ $labels.instance }} disk usage on {{ $labels.mountpoint }} greater than 80%."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              editorMode: code
              expr: 100 - ((node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} * 100) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
              instant: true
              range: false
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 80
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

      - uid: llm-test-ec2-service-down
        title: "[llm]-[test]-[ec2]-[service]-[ollama.service]"
        condition: B
        for: 1m
        labels:
          severity: critical
          environment: test
          component: systemd
        annotations:
          summary: "Systemd service down"
          description: "Service {{ $labels.name }} on {{ $labels.instance }} is down."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              editorMode: code
              expr: node_systemd_unit_state{state="active", name=~"ollama.service"}
              instant: true
              range: false
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last

  - orgId: 1
    name: elb-alerts
    folder: LLM-Test-Alerts
    interval: 1m
    rules:
      - uid: llm-test-elb-high-host-count
        title: "[llm]-[test]-[elb]-[high]-[unhealty-host-count]"
        condition: C
        for: 5m
        labels:
          severity: high
          environment: test
          component: elb
        annotations:
          summary: "Unhealthy Host Count is High"
          description: "Target Group has unhealthy hosts."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: cloudwatch-ds
            model:
              namespace: AWS/ApplicationELB
              metricName: UnHealthyHostCount
              statistic: Maximum
              period: "60"
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: max
          - refId: C
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - B

      - uid: llm-test-elb-medium-4xx
        title: "[llm]-[test]-[elb]-[medium]-[4XX-errors]"
        condition: C
        for: 5m
        labels:
          severity: medium
          environment: test
          component: elb
        annotations:
          summary: "High rate of 4XX errors on ELB"
          description: "HTTP 4XX error count exceeded 20."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: cloudwatch-ds
            model:
              namespace: AWS/ApplicationELB
              metricName: HTTPCode_Target_4XX_Count
              statistic: Sum
              period: "300"
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: sum
          - refId: C
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 2
                  operator:
                    type: and
                  query:
                    params:
                      - B

      - uid: llm-test-elb-medium-5xx
        title: "[llm]-[test]-[elb]-[medium]-[5XX-errors]"
        condition: C
        for: 5m
        labels:
          severity: medium
          environment: test
          component: elb
        annotations:
          summary: "5XX Server errors on ELB"
          description: "HTTP 5XX error count exceeded 5."
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: cloudwatch-ds
            model:
              namespace: AWS/ApplicationELB
              metricName: HTTPCode_Target_5XX_Count
              statistic: Sum
              period: "300"
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: sum
          - refId: C
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 2
                  operator:
                    type: and
                  query:
                    params:
                      - B
